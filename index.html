<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Local en el Navegador (WebLLM)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            text-align: center;
            color: #38bdf8;
        }
        #chat-box {
            height: 350px;
            border: 1px solid #334155;
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            word-break: break-word;
        }
        .user-message {
            background: #0284c7;
            align-self: flex-end;
        }
        .ai-message {
            background: #334155;
            align-self: flex-start;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) {
            background: #0369a1;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #status {
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Investigador / IA en el Navegador</h1>
        <div id="status">Cargando motor de IA... (La primera vez descargará el modelo)</div>
        
        <div id="chat-box"></div>
        
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Escribe algo..." disabled>
            <button id="send-btn" onclick="enviarMensaje()" disabled>Enviar</button>
        </div>
    </div>

    <!-- Importar WebLLM desde ESM -->
    <script type="module">
        import { CreateWebWorkerMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        // Usaremos un modelo ultraligero y rápido optimizado para web
        const SELECTED_MODEL = "SmolLM2-1.7B-Instruct-q4f16_1-MLC";
        
        let engine = null;
        const statusDiv = document.getElementById("status");
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        async function inicializarIA() {
            try {
                // Inicializar el motor pasando un callback para reportar el progreso de descarga
                engine = await CreateWebWorkerMLCEngine(
                    SELECTED_MODEL,
                    {
                        initProgressCallback: (report) => {
                            statusDiv.textContent = report.text;
                        }
                    }
                );

                statusDiv.textContent = "¡IA lista y corriendo localmente en tu navegador!";
                statusDiv.style.color = "#4ade80";
                userInput.disabled = false;
                sendBtn.disabled = false;
            } catch (error) {
                statusDiv.textContent = "Error: Tu navegador o dispositivo puede no soportar WebGPU.";
                statusDiv.style.color = "#f87171";
                console.error(error);
            }
        }

        window.enviarMensaje = async function() {
            const texto = userInput.value.trim();
            if (!texto || !engine) return;

            // Mostrar mensaje del usuario
            agregarMensaje(texto, "user-message");
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;

            // Crear contenedor para la respuesta de la IA (efecto streaming en vivo)
            const aiMsgDiv = agregarMensaje("Pensando...", "ai-message");

            try {
                const chunks = await engine.chat.completions.create({
                    messages: [{ role: "user", content: texto }],
                    stream: true,
                });

                let respuestaCompleta = "";
                for await (const chunk of chunks) {
                    const delta = chunk.choices[0]?.delta?.content || "";
                    respuestaCompleta += delta;
                    aiMsgDiv.textContent = respuestaCompleta;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (err) {
                aiMsgDiv.textContent = "Ocurrió un error al generar la respuesta.";
                console.error(err);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        };

        function agregarMensaje(texto, clase) {
            const div = document.createElement("div");
            div.className = `message ${clase}`;
            div.textContent = texto;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        // Permitir enviar con la tecla Enter
        userInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") enviarMensaje();
        });

        // Arrancar la carga al abrir la página
        inicializarIA();
    </script>
</body>
</html>
