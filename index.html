<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Local Seguro (CPU)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1d21; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; height: 100vh;}
        .container { width: 100%; max-width: 600px; background: #25292e; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; height: 100%; }
        
        h2 { text-align:center; color: #4fc3f7; margin: 15px 0; font-size: 1.2rem; }
        #status { font-size: 0.85rem; color: #888; margin-bottom: 10px; text-align: center; padding: 0 15px;}
        
        #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #1a1d21; border-radius: 8px 8px 0 0; border-bottom: 1px solid #333;}
        .message { padding: 10px 15px; border-radius: 8px; max-width: 80%; line-height: 1.5; word-wrap: break-word; font-size: 0.95rem;}
        .user { background-color: #0277bd; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .assistant { background-color: #37474f; color: #eceff1; align-self: flex-start; border-bottom-left-radius: 2px; }
        .assistant strong { color: #81d4fa; display: block; margin-bottom: 5px; font-size: 0.8rem;}

        .input-area { padding: 15px; background: #25292e; border-top: 1px solid #333; display: flex; gap: 10px; border-radius: 0 0 12px 12px; }
        input[type="text"] { flex: 1; padding: 12px; background: #37474f; border: 1px solid #455a64; color: white; border-radius: 6px; font-size: 1rem; outline: none;}
        input[type="text"]:focus { border-color: #4fc3f7; }
        button { background-color: #4fc3f7; color: #1a1d21; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s;}
        button:hover { background-color: #81d4fa; }
        button:disabled { background-color: #546e7a; cursor: not-allowed; color: #b0bec5;}
    </style>
</head>
<body>

    <div class="container">
        <h2>Chatbot Local Seguro (CPU / Wasm)</h2>
        <div id="status">Iniciando motor seguro... (descargando modelo optimizado)</div>
        
        <div id="chat-history"></div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Escribe un mensaje..." disabled>
            <button id="send-btn" onclick="enviarMensaje()" disabled>Enviar</button>
        </div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        // CONFIGURACIÓN CRÍTICA PARA EVITAR EL ERROR DE BÚFER:
        env.allowLocalModels = false;
        env.backends.onnx.wasm.numThreads = 1; // Forzar 1 hilo previene el RangeError de offset en WebAssembly

        const statusDiv = document.getElementById('status');
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatHistory = document.getElementById('chat-history');

        let generator = null;

        async function cargarModelo() {
            statusDiv.textContent = "Cargando modelo ligero en memoria (esto puede tardar un momento)...";
            sendBtn.disabled = true;

            try {
                // Usamos un modelo ultra-optimizado y pequeño que no desborda la memoria de Wasm
                generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat');
                
                statusDiv.textContent = "¡Modelo listo y seguro en CPU!";
                statusDiv.style.color = "#81c784";
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
                
                agregarMensaje("assistant", "¡Hola! Ya estoy inicializado de forma segura en tu navegador. ¿En qué te ayudo?");

            } catch (e) {
                statusDiv.textContent = "Error al cargar. Revisa la consola (F12).";
                statusDiv.style.color = "#e57373";
                console.error(e);
            }
        }

        window.enviarMensaje = async function() {
            const textoUsuario = inputField.value.trim();
            if (!textoUsuario || !generator) return;

            inputField.value = '';
            inputField.disabled = true;
            sendBtn.disabled = true;
            sendBtn.textContent = "Pensando...";

            agregarMensaje("user", textoUsuario);

            try {
                const startTime = performance.now();
                
                // Prompt simplificado para Qwen
                const prompt = `<|im_start|>user\n${textoUsuario}<|im_end|>\n<|im_start|>assistant\n`;

                const output = await generator(prompt, { 
                    max_new_tokens: 80,
                    temperature: 0.7,
                    do_sample: false
                });
                
                const endTime = performance.now();
                const tiempo = ((endTime - startTime) / 1000).toFixed(1);

                let respuestaIA = output[0].generated_text;
                
                // Limpiar la salida para dejar solo lo que respondió el asistente
                if (respuestaIA.includes("<|im_start|>assistant\n")) {
                    respuestaIA = respuestaIA.split("<|im_start|>assistant\n").pop();
                }
                if (respuestaIA.includes("<|im_end|>")) {
                    respuestaIA = respuestaIA.split("<|im_end|>")[0];
                }

                agregarMensaje("assistant", respuestaIA.trim() + ` <small>(${tiempo}s)</small>`);

            } catch (e) {
                agregarMensaje("assistant", "Ocurrió un error de memoria en WebAssembly. Revisa la consola (F12).");
                console.error("Detalle del error:", e);
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                sendBtn.textContent = "Enviar";
                inputField.focus();
            }
        };

        function agregarMensaje(rol, texto) {
            const div = document.createElement('div');
            div.className = `message ${rol}`;
            if (rol === 'assistant') {
                div.innerHTML = `<strong>IA Local:</strong> ${texto}`;
            } else {
                div.textContent = texto;
            }
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });

        cargarModelo();
    </script>
</body>
</html>
