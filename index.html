<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Local en CPU (Transformers.js)</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        textarea, input { width: 100%; padding: 10px; margin-bottom: 10px; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;}
        button { background-color: #bb86fc; color: black; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #666; cursor: not-allowed; }
        #output { margin-top: 20px; background: #2c2c2c; padding: 15px; border-radius: 4px; min-height: 50px; }
        #status { font-size: 0.9em; color: #888; margin-bottom: 10px; text-align: center;}
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align:center">Resumidor (CPU)</h2>
        <div id="status">Esperando iniciar...</div>
        
        <p>Texto a resumir:</p>
        <textarea id="input-text" rows="6">Transformers.js es una biblioteca de JavaScript que permite ejecutar modelos de aprendizaje automático directamente en el navegador. Utiliza WebAssembly y, si está disponible, WebGPU para acelerar los cálculos. Al ejecutarse en el cliente, no requiere un servidor centralizado, lo que reduce los costos de alojamiento y mejora la privacidad del usuario, ya que los datos no salen de la computadora del cliente. Sin embargo, la primera carga puede ser lenta debido a la descarga del modelo.</textarea>
        
        <button id="summarize-btn" onclick="resumirTexto()" disabled>Resumir</button>
        
        <h3>Resultado:</h3>
        <div id="output">...</div>
    </div>

    <script type="module">
        // Importar la librería desde CDN
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        // IMPORTANTE: Desactivar WebGPU explícitamente para forzar el uso de CPU/Wasm
        env.allowLocalModels = false;
        env.backends.onnx.wasm.numThreads = navigator.hardwareConcurrency || 4; // Usar hilos disponibles

        const statusDiv = document.getElementById('status');
        const inputArea = document.getElementById('input-text');
        const btn = document.getElementById('summarize-btn');
        const outputDiv = document.getElementById('output');

        let summarizer = null;

        async function cargarModelo() {
            statusDiv.textContent = "Cargando modelo en CPU (esto tomará un tiempo la primera vez)...";
            btn.disabled = true;

            try {
                // Usamos un modelo pequeño optimizado para web: t5-small
                // Al estar en un módulo, esto descargará los archivos necesarios
                summarizer = await pipeline('summarization', 'Xenova/t5-small');
                
                statusDiv.textContent = "¡Modelo listo en CPU! Puedes escribir tu texto.";
                statusDiv.style.color = "#81c784";
                btn.disabled = false;
            } catch (e) {
                statusDiv.textContent = "Error al cargar el modelo. Revisa la consola.";
                statusDiv.style.color = "#e57373";
                console.error(e);
            }
        }

        window.resumirTexto = async function() {
            const texto = inputArea.value;
            if (!texto || !summarizer) return;

            btn.disabled = true;
            btn.textContent = "Resumiendo (CPU lento)...";
            outputDiv.textContent = "La CPU está trabajando...";

            try {
                // Ejecutar el modelo. T5-small puede tardar bastante en CPU.
                const startTime = performance.now();
                const resultado = await summarizer(texto, { max_length: 60, min_length: 25, do_sample: false });
                const endTime = performance.now();
                
                const tiempoSegundos = ((endTime - startTime) / 1000).toFixed(2);
                outputDiv.textContent = resultado[0].summary_text + ` (Tiempo: ${tiempoSegundos}s)`;
            } catch (e) {
                outputDiv.textContent = "Error durante la generación.";
                console.error(e);
            } finally {
                btn.disabled = false;
                btn.textContent = "Resumir";
            }
        };

        // Iniciar la carga al abrir la página
        cargarModelo();

    </script>
</body>
</html>
